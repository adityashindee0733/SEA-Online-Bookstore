apiVersion: apps/v1
kind: Deployment
metadata:
  name: bookstore-backend
spec:
  replicas: 1
  selector:
    matchLabels:
      app: bookstore-backend
  template:
    metadata:
      labels:
        app: bookstore-backend
    spec:
      containers:
        - name: backend
          image: adityashinde24/bookstore-backend:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 5000
          env:
            - name: PORT
              value: "5000"
            - name: MONGO_URL
              value: "mongodb://bookstore-mongo:27017/bookstore"
---
apiVersion: v1
kind: Service
metadata:
  name: bookstore-backend
spec:
  type: NodePort
  selector:
    app: bookstore-backend
  ports:
    - port: 5000
      targetPort: 5000
      nodePort: 30081