apiVersion: apps/v1
kind: Deployment
metadata:
  name: bookstore-frontend
spec:
  replicas: 1
  selector:
    matchLabels:
      app: bookstore-frontend
  template:
    metadata:
      labels:
        app: bookstore-frontend
    spec:
      containers:
        - name: frontend
          image: adityashinde24/bookstore-frontend:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 5173
---
apiVersion: v1
kind: Service
metadata:
  name: bookstore-frontend
spec:
  type: NodePort
  selector:
    app: bookstore-frontend
  ports:
    - port: 5173
      targetPort: 5173
      nodePort: 30080